name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    name: Bump version and open release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Bump Cargo.toml version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          bump="${{ github.event.inputs.version_bump }}"
          if [[ -z "$bump" ]]; then
            echo 'version_bump input is required'
            exit 1
          fi

          version="$(python - "$bump" <<'PY'
          import re
          from pathlib import Path
          import sys

          bump = sys.argv[1]
          path = Path('Cargo.toml')
          text = path.read_text()

          match = re.search(r'^(version\s*=\s*)"(\d+)\.(\d+)\.(\d+)"$', text, flags=re.M)
          if not match:
                raise SystemExit('Failed to parse semver version in Cargo.toml')

          prefix, major, minor, patch = match.groups()
          major = int(major)
          minor = int(minor)
          patch = int(patch)

          if bump == 'patch':
                patch += 1
          elif bump == 'minor':
                minor += 1
                patch = 0
          elif bump == 'major':
                major += 1
                minor = 0
                patch = 0
          else:
                raise SystemExit(f'Unsupported version_bump value: {bump}')

          version = f'{major}.{minor}.{patch}'
          new_text, count = re.subn(r'^(version\s*=\s*)"[^"]+"$', rf'\1"{version}"', text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit('Failed to update version in Cargo.toml')
          path.write_text(new_text)
          print(version)
          PY
          )"
          echo "NEW_VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Regenerate Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile

      - name: Create release branch and push
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.NEW_VERSION }}"
          branch="release/v$version"

          git checkout -b "$branch"
          git add Cargo.toml Cargo.lock
          git commit -m "Bump version to $version"
          git push origin "$branch"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.NEW_VERSION }}"
          branch="release/v$version"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Release v$version" \
            --body "Bumps Cargo.toml version to $version. Merging this PR triggers the publish workflow."
